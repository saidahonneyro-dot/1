// мягкое пятно для частиц и ореолов
function dotTexture(inner = 0.0) {

}

  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.translate(256, 256);
  for (let i = 0; i < n; i++) {

    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

}
const DOT = dotTexture();

    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 4));
    const m = new THREE.ShaderMaterial({
      uniforms: { map: { value: DOT }, uScale: { value: H / (2 * Math.tan((FOV * Math.PI) / 360)) } },
      vertexShader: `attribute float aSize; attribute vec4 aColor; varying vec4 vC; uniform float uScale;
        void main(){ vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=min(aSize*uScale/-mv.z, 480.0); }`,
      fragmentShader: `uniform sampler2D map; varying vec4 vC; void main(){ vec4 t=texture2D(map,gl_PointCoord); gl_FragColor=vec4(vC.rgb*vC.a*t.a,1.0); }`,
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
    });

  }
  begin() { this.k = 0; }
  add(x, y, z, s, r, g, b, a) {
    if (a <= 0.004 || this.k >= this.n) return;
    const k = this.k++;
    this.pos[k * 3] = x; this.pos[k * 3 + 1] = y; this.pos[k * 3 + 2] = z; this.size[k] = s;
    this.col[k * 4] = r; this.col[k * 4 + 1] = g; this.col[k * 4 + 2] = b; this.col[k * 4 + 3] = a;
  }
  end() {
    this.geo.setDrawRange(0, this.k);
    for (const a of ['position', 'aSize', 'aColor']) this.geo.attributes[a].needsUpdate = true;
  }
}

// ---------- камера: [время, cx, cy, масштаб, поворот°, наклон°] ----------
const CAM = [
  [0.0, 1500, 960, 0.30, -16, -5],
  [5.2, 1500, 960, 0.335, -7, -3],

function camAt(t) {
  let i = 0;
  while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++;

async function build() {
  const [albedo, normal, wAlb, wNor, fAlb, fNor, hImg] = await Promise.all([
    tex('/build/r_albedo.jpg', true), tex('/build/r_normal.png', false),
    tex('/build/w_albedo.jpg', true, [3.2, 2.4]), tex('/build/w_normal.png', false, [3.2, 2.4]),
    tex('/build/w_albedo.jpg', true, [3, 2]), tex('/build/w_normal.png', false, [3, 2]),
    img('/build/r_height.png'),

  // ---- плита с рельефом: реальная геометрия по карте высот ----
  const SX = Number(Q.get('seg') || 1000), SY = Math.round(SX * 0.64);
  const geo = new THREE.PlaneGeometry(30, 19.2, SX, SY);

  const back = new THREE.Mesh(new THREE.BoxGeometry(30.5, 19.7, 1.5), edgeMat);
  back.position.z = -0.85; back.castShadow = true; back.receiveShadow = true; scene.add(back);

  // ---- стена, пол ----
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(220, 150), new THREE.MeshStandardMaterial({ map: wAlb, normalMap: wNor, roughness: 0.94 }));
  wall.position.set(0, 10, -1.6); wall.receiveShadow = true; scene.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(220, 90), new THREE.MeshStandardMaterial({ map: fAlb, normalMap: fNor, roughness: 0.55, metalness: 0.05, color: 0x8a7866 }));

  // цоколь под плитой
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(34, 7.2, 3.2), new THREE.MeshStandardMaterial({ map: wAlb.clone(), normalMap: wNor.clone(), roughness: 0.92, color: 0xb09a7c }));
  plinth.position.set(0, -13.45, 0); plinth.receiveShadow = true; plinth.castShadow = true; scene.add(plinth);

  // ---- жаровни ----
  const bronze = new THREE.MeshStandardMaterial({ color: 0x4a3418, roughness: 0.42, metalness: 0.85 });
  const BR = [new THREE.Vector3(-12.2, -11.9, 5.2), new THREE.Vector3(12.2, -11.9, 5.2)];
  const brLights = [];
  for (const p of BR) {
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.5, 4.2, 20), bronze); stand.position.set(p.x, -14.9, p.z); scene.add(stand);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.15, 0.3, 28), bronze); foot.position.set(p.x, -16.85, p.z); scene.add(foot);
    const pts = []; for (let i = 0; i <= 14; i++) { const a = (i / 14) * Math.PI * 0.5; pts.push(new THREE.Vector2(0.15 + Math.sin(a) * 1.45, -Math.cos(a) * 0.95)); }
    pts.push(new THREE.Vector2(1.72, 0.06), new THREE.Vector2(1.6, 0.16), new THREE.Vector2(1.4, 0.06));
    const bowlMat = bronze.clone(); bowlMat.side = THREE.DoubleSide;
    const bowl = new THREE.Mesh(new THREE.LatheGeometry(pts, 40), bowlMat); bowl.position.set(p.x, -12.2, p.z); scene.add(bowl);
    const coal = new THREE.Mesh(new THREE.CylinderGeometry(1.36, 1.2, 0.2, 28), new THREE.MeshBasicMaterial({ color: 0xb8300a })); coal.position.set(p.x, -12.28, p.z); scene.add(coal);
    const L = new THREE.PointLight(0xff9450, 1, 0, 1.0); L.position.set(p.x, p.y + 0.6, p.z + 0.4); scene.add(L); brLights.push(L);
  }

  // ---- основной свет (с тенями) ----
  const key = new THREE.SpotLight(0xfff0dc, 3.2, 0, 0.62, 0.75, 0);
  key.position.set(-26, 24, 19); key.target.position.set(0, -1, 0);
  key.castShadow = true; key.shadow.mapSize.set(Number(Q.get('sm') || 4096), Number(Q.get('sm') || 4096));
  key.shadow.camera.near = 18; key.shadow.camera.far = 70; key.shadow.bias = -0.0012; key.shadow.normalBias = 0.0; key.shadow.radius = 2.2;
  scene.add(key, key.target);

  // ---- «волшебный» свет ----
  const mk = (c, p) => { const l = new THREE.PointLight(c, 0, 0, 1.0); l.position.copy(p); scene.add(l); return l; };
  const sunL = mk(0xffa040, PX(600, 500, 2.6));
  const vatL = mk(0xffb04a, PX(1620, 1230, 2.0));
  const starL = mk(0xffe0a0, PX(1290, 470, 2.2));
  const vesL = mk(0xffb050, PX(2400, 1110, 1.8));
  const skyL = mk(0xffcf80, new THREE.Vector3(0, 14, 9));

  const glow = (map, p, size, color) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
    m.position.copy(p); scene.add(m); return m;
  };
  const sunG = glow(DOT, PX(600, 500, 0.9), 9, 0xffa24a);
  const sunR = glow(raysTexture(16, 16), PX(600, 500, 0.75), 17, 0xffb060);
  const starG = glow(DOT, PX(1290, 470, 0.9), 6, 0xffe2b0);
  const starR = glow(raysTexture(16, 11), PX(1290, 470, 0.8), 13, 0xffdca0);
  const vatG = glow(DOT, PX(1620, 1262, 0.95), 7, 0xffb050);
  const vesG = glow(DOT, PX(2400, 1130, 0.95), 5.5, 0xffb050);
  const haloL = glow(DOT, PX(2066, 960, 0.9), 5.2, 0xffc878), haloR = glow(DOT, PX(2734, 960, 0.9), 5.2, 0xffc878);

  // ---- золото в тростниковых трубках ----
  const strawMat = new THREE.MeshBasicMaterial({ color: 0xffc860, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 });
  const straws = [[2372, 1150, 2126, 982], [2428, 1150, 2674, 982]].map(([x1, y1, x2, y2]) => {
    const a = PX(x1, y1, 0.66), b = PX(x2, y2, 0.66), len = a.distanceTo(b);
    const g = new THREE.CylinderGeometry(0.042, 0.042, len, 10); g.translate(0, len / 2, 0);
    const m = new THREE.Mesh(g, strawMat); m.position.copy(a);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); scene.add(m); return m;
  });

  const fire = new Particles(260), sparks = new Particles(520), dust = new Particles(140);

  // ---- пост-обработка ----
  let composer = null, bloom = null;
  if (Q.get('bloom') !== '0') {
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(1); composer.setSize(W, H);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.32, 0.7, 0.93);
    composer.addPass(bloom); composer.addPass(new OutputPass());
  }

  const tgt = new THREE.Vector3();
  window.setFrame = (f) => {
    const t = f / FPS;
    const fl = (k) => 1 + 0.10 * Math.sin(t * 9.1 + k * 1.7) + 0.07 * Math.sin(t * 15.7 + k * 2.3) + 0.05 * Math.sin(t * 23.3 + k) + 0.04 * Math.sin(t * 4.3 + k * 3.1);
    const flick = 1 + 0.03 * Math.sin(t * 7.3) + 0.02 * Math.sin(t * 13.1 + 1.3);

    // камера
    const [cx_, cy_, s, yaw0, pit0] = camAt(t);
    const yaw = (yaw0 + 0.5 * Math.sin(t * 0.7) + 0.25 * Math.sin(t * 1.9 + 1)) * Math.PI / 180;
    const pit = (pit0 + 0.35 * Math.sin(t * 0.9 + 2)) * Math.PI / 180;
    const d = (19.2 / s) / 2 / Math.tan((FOV * Math.PI) / 360);
    tgt.copy(PX(cx_, cy_, 0.2));
    camera.position.set(tgt.x + d * Math.sin(yaw) * Math.cos(pit), tgt.y + d * Math.sin(pit), tgt.z + d * Math.cos(yaw) * Math.cos(pit));
    camera.lookAt(tgt);

    const finale = win(t, 49.9, 56.4, 1.6, 1.4);
    const intro = ease(t / 2.6);

    // огонь жаровен
    brLights[0].intensity = 8.5 * fl(0) * (0.25 + 0.75 * intro);
    brLights[1].intensity = 8.5 * fl(5) * (0.25 + 0.75 * intro);
    key.intensity = (2.0 + 1.0 * finale) * intro * flick;
    hemi.intensity = 0.22 + 0.16 * finale;

    const sun = Math.max(0.10, win(t, 6.2, 9.2, 0.7, 1.4), 0.85 * finale);
    sunL.intensity = 6.5 * sun * flick; sunG.material.opacity = 0.42 * sun; sunR.material.opacity = 0.30 * Math.max(win(t, 6.4, 9.4, 0.8, 1.4), 0.9 * finale); sunR.rotation.z = t * 0.06;
    const magic = win(t, 22.6, 25.2, 0.5, 0.9);
    const vat = Math.max(0.10 * clamp((t - 11) / 2), 0.55 * win(t, 19.2, 22.8, 0.8, 0.4), magic, 0.75 * win(t, 24.8, 28.2, 0.4, 1.0), 0.6 * finale);
    vatL.intensity = 6 * vat * fl(9); vatG.material.opacity = 0.4 * vat;
    const miracle = Math.max(win(t, 27.6, 30.9, 0.9, 0.8), 0.7 * finale, 0.3 * magic);
    starL.intensity = 5 * miracle * flick; starG.material.opacity = 0.5 * miracle; starR.material.opacity = 0.34 * miracle; starR.rotation.z = -t * 0.08;
    const vessel = Math.max(0.7 * win(t, 34.9, 37.4, 0.6, 0.8), 0.45 * win(t, 40.5, 46.4, 1.2, 0.6), 0.8 * win(t, 46.4, 48.6, 0.5, 0.5), 0.6 * finale);
    vesL.intensity = 4.5 * vessel * fl(3); vesG.material.opacity = 0.36 * vessel;
    const halo = Math.max(win(t, 42.6, 46.4, 0.7, 0.6) * 0.6, win(t, 37.9, 40.5, 0.5, 0.5) * 0.3);
    haloL.material.opacity = halo; haloR.material.opacity = halo;
    skyL.intensity = 9 * finale;
    const flow = ease((t - 33.0) / 1.9);
    const strawA = clamp((t - 32.9) / 0.3) * (t < 46.4 ? 1 : Math.max(0, 1 - (t - 46.4))) * (0.82 + 0.18 * Math.sin(t * 5));
    strawMat.opacity = Math.max(strawA, finale * 0.8) * 0.9;
    for (const m of straws) m.scale.y = t > 49 ? 1 : Math.max(0.001, flow);

    // пламя
    fire.begin();
    BR.forEach((p, b) => {
      for (let i = 0; i < 110; i++) {
        const j = i + b * 200;
        const q = (t * (0.85 + 0.75 * hash(j, 1)) + hash(j, 2)) % 1;
        const sp = 1 - q * 0.8;
        const x = p.x + (hash(j, 3) - 0.5) * 2.0 * sp + Math.sin(q * 9 + hash(j, 4) * 6.28 + t * 2) * 0.16;
        const z = p.z + (hash(j, 6) - 0.5) * 2.0 * sp;
        const y = p.y - 0.35 + q * (3.2 + 2.6 * hash(j, 5));
        const a = Math.pow(1 - q, 1.3) * Math.min(1, q * 9) * 0.26 * intro;
        fire.add(x, y, z, (1.7 - q * 1.1), 1.0, lerp(0.74, 0.22, q), lerp(0.30, 0.03, q), a);
      }
      for (let i = 0; i < 14; i++) { // угольки
        const j = i + b * 50 + 900;
        const q = (t * (0.12 + 0.12 * hash(j, 1)) + hash(j, 2)) % 1;
        fire.add(p.x + (hash(j, 3) - 0.5) * 1.4 + Math.sin(q * 11 + j) * 0.5, p.y + 1 + q * 7.5, p.z + (hash(j, 4) - 0.5) * 1.4, 0.13, 1, 0.55, 0.15, Math.sin(Math.PI * q) * 0.9 * intro);
      }
    });
    fire.end();

    // искры и пар
    sparks.begin();
    const vatS = Math.max(0.35 * win(t, 19.4, 22.8, 1, 0.4), magic, 0.8 * win(t, 24.9, 30.6, 0.3, 1.2), 0.7 * finale);
    if (vatS > 0.01) for (let i = 0; i < 110; i++) {
      const q = (t * (0.16 + 0.16 * hash(i, 1)) + hash(i, 2)) % 1;
      const x = 1620 + (hash(i, 3) - 0.5) * 300 + Math.sin(q * 7 + hash(i, 4) * 6.28) * (30 + 60 * q), y = 1262 - q * (520 + 420 * hash(i, 5));
      const v = PX(x, y, 0.75 + hash(i, 8) * 2.6 + q * 0.8);
      sparks.add(v.x, v.y, v.z, 0.16 + 0.26 * hash(i, 6), 1, 0.74, 0.36, Math.sin(Math.PI * q) * vatS * (0.5 + 0.5 * hash(i, 7)));
    }
    const boil = Math.max(win(t, 11.5, 31, 1.5, 1.5) * 0.55, win(t, 19.2, 28.4, 0.6, 0.8), 0.5 * finale);
    if (boil > 0.01) for (let i = 0; i < 46; i++) { // пар над чаном
      const q = (t * (0.10 + 0.08 * hash(i, 11)) + hash(i, 12)) % 1;
      const v = PX(1500 + hash(i, 13) * 250 + Math.sin(q * 5 + i) * 50, 1250 - q * 620, 0.9 + hash(i, 14) * 1.2 + q * 1.4);
      sparks.add(v.x, v.y, v.z, 1.0 + 2.2 * q, 0.9, 0.82, 0.68, Math.sin(Math.PI * q) * 0.07 * boil);
    }
    const vs = Math.max(0.6 * win(t, 34.8, 37.2, 0.6, 0.8), 0.7 * win(t, 42.6, 48.4, 0.8, 0.6), 0.6 * finale);
    if (vs > 0.01) for (let i = 0; i < 60; i++) {
      const q = (t * (0.14 + 0.14 * hash(i, 21)) + hash(i, 22)) % 1;
      const v = PX(2400 + (hash(i, 23) - 0.5) * 130 + Math.sin(q * 6 + hash(i, 24) * 6.28) * (20 + 90 * q), 1130 - q * (380 + 360 * hash(i, 25)), 0.8 + hash(i, 28) * 2.2);
      sparks.add(v.x, v.y, v.z, 0.15 + 0.22 * hash(i, 26), 1, 0.74, 0.36, Math.sin(Math.PI * q) * vs * (0.5 + 0.5 * hash(i, 27)));
    }
    if (finale > 0.01) for (let i = 0; i < 240; i++) {
      const q = (t * (0.05 + 0.07 * hash(i, 31)) + hash(i, 32)) % 1;
      const v = PX(60 + hash(i, 33) * 2880 + Math.sin(q * 5 + i) * 40, 1750 - q * 1600, 0.8 + hash(i, 36) * 7);
      sparks.add(v.x, v.y, v.z, 0.22 + 0.34 * hash(i, 34), 1, 0.76, 0.38, Math.sin(Math.PI * q) * finale * (0.35 + 0.5 * hash(i, 35)));
    }
    sparks.end();

    // пылинки в воздухе между камерой и плитой
    dust.begin();
    for (let i = 0; i < 140; i++) {
      const k = 0.12 + 0.8 * hash(i, 41);            // доля пути от цели к камере
      const spread = d * 0.42 * (1 - k * 0.6);
      const x = lerp(tgt.x, camera.position.x, k) + ((hash(i, 42) + t * 0.012 * (hash(i, 45) - 0.3)) % 1 - 0.5) * spread;
      const y = lerp(tgt.y, camera.position.y, k) + (((hash(i, 43) + t * 0.01 * (0.4 + hash(i, 46))) % 1) - 0.5) * spread * 2.2;
      const z = lerp(tgt.z, camera.position.z, k);
      dust.add(x, y, z, d * 0.0045 * (0.6 + hash(i, 44)), 1, 0.85, 0.62, (0.10 + 0.22 * hash(i, 47)) * (0.6 + 0.4 * Math.sin(t * (0.6 + hash(i, 48)) + i * 2.1)));
    }
    dust.end();

    if (composer) composer.render(); else renderer.render(scene, camera);

    // ---- подписи ----
    const wide = Math.max(win(t, 0.5, 5.5, 1.0, 0.5), win(t, 51.8, 54.9, 0.7, 0.4));
    $('title').style.opacity = wide;
    $('title').style.transform = `translateY(${((1 - ease(clamp((t - 0.5) / 1.4))) * 22).toFixed(2)}px)`;
    const bigW = win(t, 42.2, 46.5, 0.4, 0.4);
    $('label').style.opacity = win(t, 6.3, 51.0, 0.6, 0.6) * (1 - bigW);
    $('topGrad').style.opacity = 0.3 + 0.7 * Math.max(wide, bigW);
    $('big').style.opacity = win(t, 42.7, 46.3, 0.45, 0.4);
    $('big').firstElementChild.style.letterSpacing = (0.05 + 0.03 * clamp((t - 42.7) / 3.6)).toFixed(4) + 'em';
    $('big').lastElementChild.style.opacity = clamp((t - 44.55) / 0.4);
    let txt = '', a = 0, rise = 0;
    for (const [st, en, tx] of CAPS) if (t >= st - 0.04 && t < en + 0.12) { txt = tx; a = clamp((t - st + 0.04) / 0.16) * clamp((en + 0.12 - t) / 0.12); rise = (1 - clamp((t - st + 0.04) / 0.22)) * 10; break; }
    const cap = $('cap'); if (cap.textContent !== txt) cap.textContent = txt;
    cap.style.opacity = a; cap.style.transform = `translateY(${rise.toFixed(2)}px)`;
    const endA = clamp((t - 54.75) / 0.6), end = $('end');
    end.style.opacity = endA; end.style.visibility = endA > 0 ? 'visible' : 'hidden';
    $('botGrad').style.opacity = 1 - 0.6 * endA;
    if (endA > 0) {
      const k1 = ease((t - 54.95) / 0.8), k2 = ease((t - 56.25) / 0.8);
      const t1 = end.querySelector('.t1'), t2 = end.querySelector('.t2'), rule = end.querySelector('.rule'), sv = end.querySelector('svg');
      t1.style.opacity = k1; t1.style.transform = `translateY(${((1 - k1) * 26).toFixed(2)}px) scale(${(0.96 + 0.04 * k1 + 0.012 * clamp((t - 55) / 4.5)).toFixed(4)})`;
      sv.style.opacity = k1; sv.style.transform = `rotate(${((t - 55) * 5).toFixed(3)}deg) scale(${(0.8 + 0.2 * k1).toFixed(4)})`;
      rule.style.transform = `scaleX(${ease((t - 55.5) / 0.9).toFixed(4)})`;
      t2.style.opacity = k2; t2.style.transform = `translateY(${((1 - k2) * 18).toFixed(2)}px)`;
    }
    $('black').style.opacity = Math.max(1 - ease(t / 1.9), clamp((t - (DUR - 0.6)) / 0.55));
    return renderer.info.render.triangles;
  };
  await document.fonts.ready;
  await Promise.all(['600 40px CG', '700 40px CG', 'italic 600 40px CG', 'italic 500 40px CG', '600 40px CSC', '700 40px CSC'].map((f) => document.fonts.load(f, 'АБВ абв')));
  setFrame(0);
  return true;
}
window.ready = build();
</script>
</body>
</html>
